<!doctype html><html lang="zh-CN"><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VTuber Head Tilt Live</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#202633;color:#f1f5fa;font:15px system-ui}aside{position:fixed;right:0;top:0;bottom:0;width:330px;padding:20px;overflow:auto;background:#111827}#view{position:fixed;inset:0 330px 0 0}canvas{display:block}label{display:block;margin-top:18px}input[type=file],input[type=range]{width:100%;margin-top:8px}button{padding:10px;margin:8px 5px 0 0;cursor:pointer}h1{font-size:23px}p,small{line-height:1.6}#status,#states{white-space:pre-wrap;overflow-wrap:anywhere}#states{background:#202d42;padding:12px}small{color:#bcc7d9}.clean aside{display:none}.clean #view{right:0}#restore{display:none;position:fixed;top:8px;right:8px;opacity:.15}.clean #restore{display:block}#restore:hover{opacity:1}
</style>
<div id="view"></div><button id="restore">H Restore controls</button>
<aside><h1>VTuber Head Tilt · Live</h1><p>Jupyter  →  → VRM</p>
<button id="defaultAvatar">Load project avatar</button>
<label>Select another VRM<input id="vrmFile" type="file" accept=".vrm"></label>
<p id="status"> cdn.jsdelivr.net。</p>
<p id="states"> notebook </p>
<label><input id="autoSwap" type="checkbox" checked> Automatic eye mapping</label>
<label><input id="swap" type="checkbox"> Swap eyes</label>
<label><input id="smooth" type="checkbox"> Smooth expressions</label>
<label>Mouth intensity <output id="gainValue">0.70</output><input id="gain" type="range" min="0" max="1" step="0.01" value="0.7"></label>
<label>Background<select id="background"><option value="#30394c">Dark gray</option><option value="#00ff00">Green screen</option></select></label>
<label><input id="avatarBones" type="checkbox"> Show avatar skeleton / Avatar skeleton</label>
<button id="clean">Clean view / OBS</button><button id="front">Front</button><button id="back">Back</button>
<p><small>H OBS </small></p>
<p><small>classic HOG/SVM mediapipe  aa MediaPipe C  Pose Lite 0.8 </small></p>
</aside>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/","@pixiv/three-vrm":"https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.4.2/lib/three-vrm.module.min.js"}}</script>
<script type="module">
import {EXPRESSION_NAMES,liveTargets,usablePacket} from './live_state.mjs';
const el=id=>document.getElementById(id),status=el('status');
let packet=null,received=0,requestStarted=0;
// One request at a time; network time counts towards expiry
async function poll(){
  requestStarted=performance.now();
  try{
    const response=await fetch('/api/state',{cache:'no-store',signal:AbortSignal.timeout(1500)});
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json();data.age_ms+=performance.now()-requestStarted;
    packet=data;received=performance.now();
    if(el('autoSwap').checked)el('swap').checked=!Boolean(packet.mirror);
  }catch(error){packet=null;}
  setTimeout(poll,33);
}
poll();
const toggle=()=>{document.body.classList.toggle('clean');window.dispatchEvent(new Event('resize'));};
el('clean').onclick=toggle;el('restore').onclick=toggle;
window.addEventListener('keydown',event=>{if(event.key.toLowerCase()==='h'&&!['INPUT','SELECT'].includes(event.target.tagName))toggle();});
el('gain').oninput=()=>el('gainValue').value=Number(el('gain').value).toFixed(2);
try{
 const THREE=await import('three');
 const {GLTFLoader}=await import('three/addons/loaders/GLTFLoader.js');
 const {OrbitControls}=await import('three/addons/controls/OrbitControls.js');
 const {VRMLoaderPlugin,VRMUtils}=await import('@pixiv/three-vrm');
 const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.outputColorSpace=THREE.SRGBColorSpace;el('view').appendChild(renderer.domElement);
 const scene=new THREE.Scene();scene.background=new THREE.Color('#30394c');
 scene.add(new THREE.HemisphereLight(0xffffff,0x8b94aa,2));
 const light=new THREE.DirectionalLight(0xffffff,2.5);light.position.set(1,2,3);scene.add(light);
 const camera=new THREE.PerspectiveCamera(30,1,.01,100);camera.position.set(0,1.4,1.5);
 const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;
 const loader=new GLTFLoader();loader.register(parser=>new VRMLoaderPlugin(parser));
 let vrm=null,radius=1,weights=Array(7).fill(0),headBone=null;
 const headRest=new THREE.Quaternion(),headTarget=new THREE.Quaternion();
 const headEuler=new THREE.Euler(0,0,0,'ZYX');
 const resize=()=>{const view=el('view');renderer.setSize(view.clientWidth,view.clientHeight);camera.aspect=view.clientWidth/view.clientHeight;camera.updateProjectionMatrix();};
 window.addEventListener('resize',resize);resize();
 const setView=sign=>{camera.position.copy(controls.target).add(new THREE.Vector3(0,0,sign*radius));controls.update();};
 el('front').onclick=()=>setView(1);el('back').onclick=()=>setView(-1);
 el('background').onchange=()=>scene.background.set(el('background').value);

 // Convert world-space observations to local VRM bone rotations
 const vec=()=>new THREE.Vector3(), quat=()=>new THREE.Quaternion();
 const bodyLinks=[
   ['leftUpperArm','leftLowerArm',11,13],['leftLowerArm','leftHand',13,15],
   ['rightUpperArm','rightLowerArm',12,14],['rightLowerArm','rightHand',14,16],
   ['leftUpperLeg','leftLowerLeg',23,25],['leftLowerLeg','leftFoot',25,27],
   ['rightUpperLeg','rightLowerLeg',24,26],['rightLowerLeg','rightFoot',26,28]
 ];
 let bodyRig=null;
 function basis(side,up){
   if(side.lengthSq()<1e-5 || up.lengthSq()<1e-5)return null;
   const x=side.normalize(),z=vec().crossVectors(x,up);
   if(z.lengthSq()<1e-5)return null;
   z.normalize();
   return quat().setFromRotationMatrix(new THREE.Matrix4().makeBasis(x,vec().crossVectors(z,x),z));
 }
 let fingerRig=[];
 function bindFingers(model){
   const rig=[];
   for(const side of ['left','right']){
     const sign=side==='left'?1:-1;
     for(const finger of ['Thumb','Index','Middle','Ring','Little']){
       const thumb=finger==='Thumb';
       const chain=thumb?['Metacarpal','Proximal','Distal']:['Proximal','Intermediate','Distal'];
       chain.forEach((joint,index)=>{
         const node=model.humanoid.getNormalizedBoneNode(side+finger+joint);
         if(!node)return;
         // Thumb bends across palm; fingers curl towards palm
         const axis=thumb?new THREE.Vector3(0,sign,-.35*sign).normalize():new THREE.Vector3(0,0,-sign);
         rig.push({side,finger,node,axis,rest:node.quaternion.clone(),max:(thumb?[.48,.85,.70]:[1.10,1.50,1.05])[index]});
       });
     }
   }
   return rig;
 }
 function driveFingers(hands,dt){
   const q=new THREE.Quaternion();
   for(const f of fingerRig){
     const curl=hands?.[f.side]?.[f.finger];
     const valid=Number.isFinite(curl);
     q.setFromAxisAngle(f.axis,(valid?Math.max(0,Math.min(1,curl)):0)*f.max).premultiply(f.rest);
     f.node.quaternion.slerp(q,1-Math.exp(-dt/(valid ? .075 : .22)));
   }
 }
 function bindBody(model){
   const bone=name=>model.humanoid.getNormalizedBoneNode(name);
   const pos=name=>bone(name).getWorldPosition(vec());
   // Seated capture: drive the chest only; hips and legs retain their rest pose.
   // 
   const torso=bone('chest') || bone('spine');
   if(!torso || !bone('leftUpperArm') || !bone('rightUpperArm'))return null;
   const neutral=basis(pos('leftUpperArm').sub(pos('rightUpperArm')),vec().set(0,1,0));
   if(!neutral)return null;
   const links=[];
   for(const [name,child,a,b] of bodyLinks){
     if(a>=23)continue; // Skip both leg chains
     const node=bone(name);
     if(!node || !bone(child))continue;
     const dir=pos(child).sub(pos(name)).applyQuaternion(node.getWorldQuaternion(quat()).invert()).normalize();
     links.push({node,dir,rest:node.quaternion.clone(),a,b});
   }
   return {torso,neutral,rest:torso.quaternion.clone(),world:torso.getWorldQuaternion(quat()),links};
 }
 function driveBody(points,dt){
   if(!bodyRig)return;
   const {torso,neutral,rest,world,links}=bodyRig;
   const point=i=>points?.[i]?.[3]>=.55 ? vec().fromArray(points[i]) : null;
   const left=point(11),right=point(12);
   const facing=left&&right?basis(left.sub(right),vec().set(0,1,0)):null;
   const local=(node,q)=>node.parent.getWorldQuaternion(quat()).invert().multiply(q);
   const amount=valid=>1-Math.exp(-dt/(valid ? .085 : .30));
   const target=facing?local(torso,facing.clone().multiply(neutral.clone().invert()).multiply(world)):rest;
   torso.quaternion.slerp(target,amount(facing));
   for(const {node,dir,rest,a,b} of links){
     const start=point(a),end=point(b);
     let desired=rest;
     if(start&&end){
       const direction=end.sub(start).applyQuaternion(node.parent.getWorldQuaternion(quat()).invert());
       if(direction.lengthSq()>1e-5){
         desired=quat().setFromUnitVectors(dir.clone().applyQuaternion(rest),direction.normalize()).multiply(rest);
       }
     }
     node.quaternion.slerp(desired,amount(start&&end));
   }
 }

 // Draw the actual animated avatar bone positions
 const debugLines=new THREE.LineSegments(new THREE.BufferGeometry(),
   new THREE.LineBasicMaterial({color:0x00ffff,depthTest:false,depthWrite:false}));
 debugLines.frustumCulled=false;debugLines.renderOrder=999;scene.add(debugLines);
 let debugPairs=[];
 function bindDebug(model){
   const chains=[['hips','spine','chest','neck','head']];
   for(const side of ['left','right']){
     chains.push(['chest',side+'Shoulder',side+'UpperArm',side+'LowerArm',side+'Hand'],
                 ['hips',side+'UpperLeg',side+'LowerLeg',side+'Foot',side+'Toes']);
     for(const finger of ['Thumb','Index','Middle','Ring','Little']){
       const joints=finger==='Thumb'?['Metacarpal','Proximal','Distal']:['Proximal','Intermediate','Distal'];
       chains.push([side+'Hand',...joints.map(j=>side+finger+j)]);
     }
   }
   debugPairs=[];
   for(const chain of chains){
     const nodes=chain.map(name=>model.humanoid.getRawBoneNode(name)).filter(Boolean);
     for(let i=1;i<nodes.length;i++)debugPairs.push(nodes[i-1],nodes[i]);
   }
   debugLines.geometry.dispose();debugLines.geometry=new THREE.BufferGeometry();
   debugLines.geometry.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(debugPairs.length*3),3));
 }
 const debugPos=new THREE.Vector3();
 function drawDebug(){
   debugLines.visible=el('avatarBones').checked;
   if(!debugLines.visible)return;
   const attr=debugLines.geometry.getAttribute('position');
   debugPairs.forEach((node,i)=>{node.getWorldPosition(debugPos);attr.setXYZ(i,debugPos.x,debugPos.y,debugPos.z);});
   attr.needsUpdate=true;
 }
 async function loadAvatar(buffer,name){
  const gltf=await loader.parseAsync(buffer,'');const next=gltf.userData.vrm;
  if(!next)throw Error('Missing VRM extension');
  const names=next.expressionManager.expressions.map(e=>e.expressionName);
  const missing=EXPRESSION_NAMES.filter(name=>!names.includes(name));
  if(missing.length){VRMUtils.deepDispose(next.scene);throw Error('Missing expressions: '+missing.join(', '));}
  if(vrm){scene.remove(vrm.scene);VRMUtils.deepDispose(vrm.scene);}
  vrm=next;VRMUtils.rotateVRM0(vrm);scene.add(vrm.scene);weights=Array(7).fill(0);
  for(const e of vrm.expressionManager.expressions)vrm.expressionManager.setValue(e.expressionName,0);
  vrm.scene.updateMatrixWorld(true);
  const box=new THREE.Box3().setFromObject(vrm.scene),size=box.getSize(new THREE.Vector3());
  const head=vrm.humanoid.getNormalizedBoneNode('head');
  headBone=head;if(headBone)headRest.copy(headBone.quaternion);
  bindDebug(vrm);bodyRig=bindBody(vrm);fingerRig=bindFingers(vrm);
  const target=head?head.getWorldPosition(new THREE.Vector3()):box.getCenter(new THREE.Vector3());
  if(packet?.backend==='mediapipe'){
    target.copy(box.getCenter(new THREE.Vector3()));
    radius=Math.max(size.y*2.35,size.x*2.2/Math.max(.3,camera.aspect),1);
  }else{
    target.y+=size.y*.035;
    radius=Math.max(size.y*.85,.6);
  }
  controls.target.copy(target);setView(1);
  status.textContent='Avatar loaded: '+name+'\n C Q ';
 }
 async function safeLoad(getBuffer,name){
  el('defaultAvatar').disabled=true;el('vrmFile').disabled=true;status.textContent='Loading avatar...';
  try{await loadAvatar(await getBuffer(),name);}catch(error){status.textContent='Load failed: '+error.message;console.error(error);}
  finally{el('defaultAvatar').disabled=false;el('vrmFile').disabled=false;}
 }
 el('vrmFile').onchange=event=>{const file=event.target.files[0];if(file)safeLoad(()=>file.arrayBuffer(),file.name);};
 el('defaultAvatar').onclick=()=>safeLoad(async()=>{const r=await fetch('/avatar.vrm');if(!r.ok)throw Error('Check VRM_PATH');return r.arrayBuffer();},'Project VRM');
 const clock=new THREE.Clock();
 renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05),age=performance.now()-received;
  const fresh=usablePacket(packet,age),row=fresh?packet.row:null;
  const targets=liveTargets(packet,age,el('swap').checked,Number(el('gain').value));
  const alpha=el('smooth').checked?1-Math.exp(-dt/.05):1;
  if(!row||!row.head_tracking_ok)weights.fill(0);
  else{
   const eyeNames=el('swap').checked?['screen_left_eye','screen_right_eye']:['screen_right_eye','screen_left_eye'];
   for(let i=0;i<2;i++)if(row[eyeNames[i]]==='unknown'||row[eyeNames[i]+'_crop_valid']===false)weights[i]=0;
   if(row.mouth==='unknown'||row.mouth_crop_valid===false)for(let i=2;i<7;i++)weights[i]=0;
  }
  weights=weights.map((w,i)=>w+alpha*(targets[i]-w));
  if(vrm){
   // Smooth calibrated head rotation; stale input returns to rest
   const pose=row?.head_tracking_ok?row.head_pose:null;
   const angle=(key,limit)=>THREE.MathUtils.degToRad(Math.max(-limit,Math.min(limit,Number.isFinite(pose?.[key])?pose[key]:0)));
   driveBody(row?.body_points,dt);
   driveFingers(row?.hands,dt);
   headEuler.set(angle('pitch',30),angle('yaw',50),angle('roll',30),'ZYX');
   headTarget.setFromEuler(headEuler).premultiply(headRest);
   // Remove inherited body turn from face orientation
   if(pose && row?.body_points && bodyRig && headBone){
     headTarget.premultiply(bodyRig.torso.quaternion.clone().invert());
   }
   if(headBone)headBone.quaternion.slerp(headTarget,1-Math.exp(-dt/(pose ? .07 : .2)));
   EXPRESSION_NAMES.forEach((name,i)=>vrm.expressionManager.setValue(name,weights[i]));vrm.update(dt);drawDebug();
  }
  el('states').textContent=row?`${packet.backend} | Frame ${row.frame_index}\nLeft eye: ${row.screen_left_eye}\nRight eye: ${row.screen_right_eye}\n${row.mouth}\nTracking: ${row.head_tracking_ok}\nProcessing: ${Number(row.processing_ms||0).toFixed(1)} ms`:'Waiting for camera or stale connection.';
  controls.update();renderer.render(scene,camera);
 });
 el('defaultAvatar').click();
}catch(error){status.textContent='Renderer failed: '+error.message;console.error(error);}
</script></html>
